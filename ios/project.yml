name: OrgWriteNotes
options:
  bundleIdPrefix: com.orgwritenotes
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    PRODUCT_NAME: "OrgWriteNotes"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    AD_HOC_CODE_SIGNING_ALLOWED: "YES"

packages:
  OrgWriteNotesPackage:
    path: .

targets:
  OrgWriteNotes:
    type: application
    platform: iOS
    sources:
      - path: Sources/OrgWriteNotesApp
    dependencies:
      - package: OrgWriteNotesPackage
        product: OrgWriteNotesKit
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.orgwritenotes.OrgWriteNotes
        ENABLE_BITCODE: "NO"

  OrgWriteNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/OrgWriteNotesTests
    dependencies:
      - target: OrgWriteNotes
      - package: OrgWriteNotesPackage
        product: OrgWriteNotesKit

