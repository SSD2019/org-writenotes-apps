name: Org-WriteNotes Multiplatform CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release assets to GitHub Releases'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (required if publishing manually via dispatch)'
        type: string
        default: ''

jobs:
  kotlin-lint:
    name: Kotlin Linter (ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint
      - name: Run ktlint
        run: ./ktlint --baseline=ktlint-baseline.xml --relative "android/app/src/**/*.kt"

  android-build:
    name: Build Android Tablet & E-Ink APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Compile C++ JNI, Unit Test & Assemble Debug & Release APKs
        run: |
          cd android
          gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain

      - name: Stage Android APK Artifacts
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk dist/android/org-writenotes-android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/app-debug.apk
          ls -lh dist/android/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*

  linux-build:
    name: Build Linux Desktop Companion (.deb & .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Linux C++ Engine & Package Desktop Distributions
        run: |
          cd android
          gradle :desktop:test :desktop:packageDeb :desktop:createDistributable --console=plain

      - name: Stage Linux Binaries & Tarball
        run: |
          mkdir -p dist/linux
          cp android/desktop/build/compose/binaries/main/deb/*.deb dist/linux/
          tar -czvf dist/linux/org-writenotes-linux-x86_64.tar.gz -C android/desktop/build/compose/binaries/main/app org-writenotes
          ls -lh dist/linux/

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux/*

  ipados-build:
    name: Build iPadOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Run Swift Package Unit Tests
        run: |
          cd ios
          swift test

      - name: Build iPadOS IPA (XcodeGen + xcodebuild)
        run: |
          chmod +x ios/build_ipa.sh
          ./ios/build_ipa.sh

      - name: Stage iPadOS IPA Artifact
        run: |
          mkdir -p dist/ios
          cp ios/OrgWriteNotes-iPadOS.ipa dist/ios/
          ls -lh dist/ios/

      - name: Upload iPadOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipados-ipa
          path: dist/ios/OrgWriteNotes-iPadOS.ipa

  publish-release:
    name: Publish Release Assets to GitHub Releases
    needs: [ android-build, linux-build, ipados-build ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Consolidate Release Binaries
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.ipa" \) -exec cp {} release-assets/ \;
          echo "=== Consolidated Release Assets ==="
          ls -lh release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
