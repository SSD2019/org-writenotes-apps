name: Org-WriteNotes CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  emacs-ert-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: '29.3'
      - name: Run ERT Batch Tests
        run: |
          emacs -Q -batch -L emacs -l ert \
            -l emacs/org-writenotes-test.el \
            -l emacs/org-writenotes-extras-test.el \
            -f ert-run-tests-batch-and-exit
      - name: Checkdoc
        run: |
          emacs -Q -batch -L emacs --eval '(require (quote checkdoc))' \
            --eval '(setq checkdoc-diagnostic-buffer "*chk*")' \
            --eval '(progn (dolist (f (list "emacs/org-writenotes.el" "emacs/org-writenotes-extras.el")) (checkdoc-file f)) (when (get-buffer "*Warnings*") (kill-emacs 1)))'

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - name: Compile, unit-test and assemble debug APK
        run: |
          cd android
          gradle :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  kotlin-lint:
    runs-on: ubuntu-latest
    # Existing violations are recorded in ktlint-baseline.xml; only new ones fail the build.
    steps:
      - uses: actions/checkout@v4
      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint
      - name: Run ktlint
        run: ./ktlint --baseline=ktlint-baseline.xml --relative "android/app/src/**/*.kt"
